<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐝 StudyHive</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #e6e8ec;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #1a1d24;
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.6rem; margin-bottom: .3rem; }
    p.sub { color: #8b93a1; margin-bottom: 1.8rem; font-size: .9rem; }
    label { display: block; font-size: .85rem; margin-bottom: .4rem; color: #b6bcc8; }
    input {
      width: 100%;
      padding: .7rem .8rem;
      margin-bottom: 1.1rem;
      border: 1px solid #2c313c;
      border-radius: 8px;
      background: #12151b;
      color: #e6e8ec;
      font-size: .95rem;
    }
    input:focus { outline: none; border-color: #f59e0b; }
    button {
      width: 100%;
      padding: .75rem;
      border: none;
      border-radius: 8px;
      background: #f59e0b;
      color: #1a1d24;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #fbbf24; }
    .divider { text-align: center; color: #8b93a1; margin: 1.2rem 0; font-size: .85rem; }
    .link-btn {
      background: transparent;
      border: 1px solid #2c313c;
      color: #e6e8ec;
    }
    .link-btn:hover { background: #242933; }
    #msg { margin-top: 1rem; font-size: .85rem; text-align: center; min-height: 1.2em; }
    #msg.error { color: #f87171; }
    #msg.ok { color: #4ade80; }
    /* Logged-in view (hidden by default) */
    #app { display: none; text-align: center; }
    #app h2 { margin-bottom: 1rem; }
  </style>
</head>
<body>

  <!-- Signup / Login view -->
  <div class="card" id="auth-view">
    <h1>🐝 StudyHive</h1>
    <p class="sub">Social study app — sign up with any email and password.</p>

    <form id="auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="min 6 characters" minlength="6" required />

      <button type="submit" id="submit-btn">Create account</button>
    </form>

    <div class="divider">or</div>
    <button class="link-btn" id="toggle-btn">Log in</button>

    <div id="msg"></div>
  </div>

  <!-- Logged-in view -->
  <div class="card" id="app">
    <h2>🎉 You're in, <span id="user-email"></span>!</h2>
    <p class="sub">Welcome to StudyHive.</p>
    <button class="link-btn" id="logout-btn">Log out</button>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://pobooxnvlsvvxwcxsowf.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvYm9veG52bHN2dnh3Y3hzb3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMTk3NjQsImV4cCI6MjEwODU5NTc2NH0.wq44wD8ldJreamrY35LxgR637jrHcwUi6RcPbG7kw6I'
    );

    let isSignup = true;
    const authView = document.getElementById('auth-view');
    const appView = document.getElementById('app');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submit-btn');
    const toggleBtn = document.getElementById('toggle-btn');

    // Toggle between signup and login
    toggleBtn.addEventListener('click', () => {
      isSignup = !isSignup;
      submitBtn.textContent = isSignup ? 'Create account' : 'Log in';
      toggleBtn.textContent = isSignup ? 'Log in' : 'Create account';
      msg.textContent = '';
    });

    // Handle submit
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      let result;
      if (isSignup) {
        result = await supabase.auth.signUp({ email, password });
      } else {
        result = await supabase.auth.signInWithPassword({ email, password });
      }

      if (result.error) {
        msg.textContent = result.error.message;
        msg.className = 'error';
      } else if (isSignup) {
        msg.textContent = 'Check your email to confirm your account! 📧';
        msg.className = 'ok';
      } else {
        showApp(result.data.user.email);
      }
    });

    // Log out
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      showAuth();
    });

    // On load: if already logged in, skip auth
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) showApp(data.session.user.email);
    });

    function showApp(email) {
      authView.style.display = 'none';
      appView.style.display = 'block';
      document.getElementById('user-email').textContent = email;
    }
    function showAuth() {
      appView.style.display = 'none';
      authView.style.display = 'block';
    }
  </script>
</body>
</html>
